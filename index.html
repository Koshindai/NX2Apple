<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NX2Apple Console mode prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap">
<style>
/* NX2Apple Console mode: the launcher's tokens, sized for a TV at 1920x1080. */
:root {
  --bg: #0e0e0f; --surface: #1a1a1c; --surface-group: rgba(26, 26, 28, 0.75);
  --cream: #fff0d6; --cream-line: rgba(255, 240, 214, 0.35); --on-cream: #000000;
  --ready: #40d678; --building: #ffc73d; --unbuilt: #91949c; --danger: #ff6b66;
  --text: rgba(255, 255, 255, 0.92); --text-strong: #ffffff; --text-secondary: rgba(235, 235, 245, 0.6);
  --fill-1: rgba(255, 255, 255, 0.055); --fill-2: rgba(255, 255, 255, 0.07); --fill-hover: rgba(255, 255, 255, 0.08);
  --fill-3: rgba(255, 255, 255, 0.10); --fill-pressed: rgba(255, 255, 255, 0.13); --fill-track: rgba(255, 255, 255, 0.14);
  --line-1: rgba(255, 255, 255, 0.06); --line-2: rgba(255, 255, 255, 0.10); --line-3: rgba(255, 255, 255, 0.14);
  --line-console: rgba(255, 255, 255, 0.12); --line-focus: rgba(255, 255, 255, 0.22);
  --badge-bg: rgba(14, 14, 15, 0.93); --scrim: rgba(0, 0, 0, 0.6);
  --font-sans: "Manrope", system-ui, -apple-system, sans-serif;
  --radius-thumb: 5px; --radius-row: 8px; --radius-control: 9px; --radius-panel: 12px; --radius-group: 14px; --radius-console: 16px; --radius-pill: 999px;
  --shadow-menu: 0 6px 18px rgba(0, 0, 0, 0.5); --shadow-sheet: 0 24px 60px rgba(0, 0, 0, 0.55);
  --size-round: 48px; --size-play-min: 164px; --size-menu-width: 250px; --size-menu-row: 36px; --size-option-row: 52px;
}

.bp { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--text);
  font: 400 22px/1.35 var(--font-sans); -webkit-font-smoothing: antialiased; }
.bp button { font-family: inherit; }

/* Backdrop: the focused game's artwork, faded into bg */
.bp-backdrop { position: absolute; inset: 0; background: var(--art); background-size: cover; background-position: center; }
.bp-backdrop::after { content: ""; position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(14,14,15,0) 14%, rgba(14,14,15,.84) 42%, #0e0e0f 62%),
              linear-gradient(90deg, rgba(14,14,15,.9) 0%, rgba(14,14,15,0) 58%); }
.bp-backdrop[data-label]::before { content: attr(data-label); position: absolute; right: 72px; top: 120px; z-index: 1;
  font: 600 14px/1 var(--font-sans); letter-spacing: .5px; color: rgba(255,255,255,.55); }
.bp-dim { position: absolute; inset: 0; background: rgba(8, 8, 9, .62); }

/* Top bar */
.bp-top { position: absolute; left: 0; right: 0; top: 0; height: 104px; box-sizing: border-box; padding: 0 72px;
  display: flex; align-items: center; gap: 28px; z-index: 2; }
.bp-word { font: 700 28px/1 var(--font-sans); letter-spacing: -.8px; color: var(--text-strong); margin-right: 20px; }
.bp-nav { display: flex; align-items: center; gap: 6px; }
.bp-tab { border: 0; background: none; color: var(--text); font: 500 21px/1 var(--font-sans); padding: 14px 24px; border-radius: var(--radius-pill); }
.bp-tab[aria-selected="true"] { background: var(--fill-3); color: var(--text-strong); font-weight: 800; }
.bp-spacer { flex: 1 1 auto; }
.bp-pad { display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border-radius: var(--radius-pill);
  background: var(--fill-1); border: 1px solid var(--line-2); font: 600 18px/1 var(--font-sans); color: var(--text); }
.bp-pad svg { width: 24px; height: 24px; }
.bp-pad__p { color: var(--cream); font-weight: 800; }
.bp-pad--low .bp-pad__batt { color: var(--building); }
.bp-clock { font: 600 22px/1 var(--font-sans); color: var(--text-strong); font-variant-numeric: tabular-nums; margin-left: 8px; }

/* Controller glyphs */
.bp-g { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 34px; padding: 0 8px; box-sizing: border-box;
  border-radius: var(--radius-pill); background: rgba(255,255,255,.16); color: var(--text-strong); font: 800 15px/1 var(--font-sans); flex: none; }
.bp-g--a { background: var(--cream); color: var(--on-cream); }
.bp-g--sm { min-width: 28px; height: 28px; font-size: 12px; }
.bp-g svg { width: 18px; height: 18px; }

/* Hint bar */
.bp-hints { position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 0 72px; z-index: 2;
  display: flex; align-items: center; gap: 36px; background: rgba(14,14,15,.82); border-top: 1px solid var(--line-1); }
.bp-hint { display: inline-flex; align-items: center; gap: 12px; font: 600 20px/1 var(--font-sans); color: var(--text); }

/* Hero */
.bp-eyebrow { display: inline-flex; align-items: center; gap: 10px; font: 700 18px/1.2 var(--font-sans); letter-spacing: 1.8px; text-transform: uppercase; color: var(--ready); }
.bp-eyebrow::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.bp-eyebrow--building { color: var(--building); }
.bp-eyebrow--unbuilt { color: var(--unbuilt); }
.bp-title { margin: 0; font: 800 80px/1.02 var(--font-sans); letter-spacing: -2px; color: var(--text-strong); text-shadow: 0 0 12px rgba(0,0,0,.25); }
.bp-meta { display: flex; gap: 28px; font: 500 22px/1.3 var(--font-sans); color: var(--text-secondary); }
.bp-meta b { color: var(--text); font-weight: 600; }

/* Buttons */
.bp-play { display: inline-flex; align-items: center; gap: 14px; height: 72px; padding: 0 40px 0 22px; border: 0; border-radius: var(--radius-pill);
  background: var(--cream); color: var(--on-cream); font: 800 26px/1 var(--font-sans); }
.bp-play .bp-g { background: rgba(0,0,0,.12); color: var(--on-cream); }
.bp-btn { display: inline-flex; align-items: center; gap: 12px; height: 72px; padding: 0 30px; border-radius: var(--radius-pill);
  background: rgba(255,255,255,.09); border: 1px solid var(--line-3); color: var(--text-strong); font: 700 22px/1 var(--font-sans); }
.bp-btn svg { width: 26px; height: 26px; }
.bp-btn--round { width: 72px; padding: 0; justify-content: center; }
.bp-btn--round svg { width: 34px; height: 34px; }
.bp-focus { outline: 3px solid var(--cream); outline-offset: 3px; }
/* A focused button fills with cream, as the focused control does on Steam: no ring around it */
.bp-btn.bp-focus, .bp-icon.bp-focus { background: var(--cream); border-color: var(--cream); color: var(--on-cream); outline: none; }
.bp-btn.danger.bp-focus { background: var(--danger); border-color: var(--danger); color: #000000; }
/* Play is cream only while it has the focus, so the eye goes to what A does */
.bp-play:not(.bp-focus) { background: rgba(255,255,255,.12); color: var(--text-strong); }
.bp-play.bp-focus { outline: none; box-shadow: 0 10px 34px -8px rgba(255, 240, 214, .55); }
/* Round icon button of the top bar (Search) */
.bp-icon { display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 50%; box-sizing: border-box;
  background: var(--fill-1); border: 1px solid var(--line-2); color: var(--text-strong); }
.bp-icon svg { width: 24px; height: 24px; }

/* Tiles */
.bp-tile { position: relative; flex: none; width: var(--w, 400px); aspect-ratio: 1.8; border-radius: var(--radius-console); overflow: hidden;
  background: var(--art, var(--surface)); background-size: cover; box-shadow: inset 0 0 0 1px var(--line-console); }
.bp-tile[data-label]::after { content: attr(data-label); position: absolute; left: 16px; top: 14px; font: 600 13px/1 var(--font-sans); color: rgba(255,255,255,.7); letter-spacing: .4px; }
/* Focus: the library card's selection, sized for a TV. A cream contour on the artwork itself, plus a slight lift. */
.bp-tile.is-focus { transform: scale(1.03); transform-origin: center bottom; box-shadow: inset 0 0 0 3px var(--cream), 0 24px 64px -10px color-mix(in srgb, var(--glow, #000000) 65%, transparent); }
.bp-tile__badge { position: absolute; left: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: var(--radius-pill);
  background: var(--badge-bg); font: 600 18px/1 var(--font-sans); color: var(--text); }
.bp-tile__badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--ready)); }
.bp-tile__progress { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(0,0,0,.5); }
.bp-tile__progress > i { display: block; height: 100%; width: var(--p, 40%); background: var(--building); }
.bp-cap { margin-top: 14px; display: flex; flex-direction: column; gap: 4px; }
.bp-tile.is-focus + .bp-cap .bp-cap__name { color: var(--text-strong); }
.bp-cap__name { font: 700 20px/1.2 var(--font-sans); color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bp-cap__sub { font: 500 18px/1.2 var(--font-sans); color: var(--text-secondary); }

.bp-shelf-title { display: flex; align-items: baseline; gap: 18px; margin: 0; font: 800 30px/1.1 var(--font-sans); letter-spacing: -.6px; color: var(--text-strong); }
.bp-shelf-title small { font: 500 18px/1 var(--font-sans); letter-spacing: 0; color: var(--text-secondary); }

/* Filter chips */
.bp-filter { display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 22px; border-radius: var(--radius-pill);
  background: var(--fill-1); border: 1px solid var(--line-2); font: 600 19px/1 var(--font-sans); color: var(--text); }
.bp-filter b { font-weight: 600; color: var(--text-secondary); }
.bp-filter[aria-pressed="true"] { background: var(--cream); color: var(--on-cream); border-color: var(--cream); }
.bp-filter[aria-pressed="true"] b { color: rgba(0,0,0,.55); }

/* Side panels (menus) */
.bp-panel { position: absolute; top: 0; bottom: 0; box-sizing: border-box; background: rgba(22,22,24,.97); z-index: 3; display: flex; flex-direction: column; }
.bp-row { display: flex; align-items: center; gap: 20px; height: 68px; padding: 0 22px; border-radius: var(--radius-group); border: 0; background: none;
  color: var(--text); font: 600 23px/1 var(--font-sans); text-align: left; width: 100%; box-sizing: border-box; }
.bp-row svg { width: 28px; height: 28px; flex: none; color: var(--text-secondary); }
.bp-row.is-focus { background: var(--fill-3); color: var(--text-strong); outline: 3px solid var(--cream); outline-offset: 0; }
.bp-row.is-focus svg { color: var(--cream); }
.bp-row--danger, .bp-row--danger svg { color: var(--danger); }
.bp-row__end { margin-left: auto; font: 500 19px/1 var(--font-sans); color: var(--text-secondary); }
.bp-sep { height: 1px; background: var(--line-2); margin: 10px 22px; }

.bp-group { background: var(--surface-group); border: 1px solid var(--line-1); border-radius: var(--radius-group); }
/* The knob slides with a small overshoot, and the track and knob colours cross-fade */
.bp-switch { width: 60px; height: 36px; border-radius: var(--radius-pill); background: var(--fill-track); padding: 4px; box-sizing: border-box; display: inline-flex; flex: none;
  transition: background-color .22s ease-out; }
.bp-switch::after { content: ""; width: 28px; height: 28px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 1px 3px rgba(0,0,0,.35);
  transition: transform .26s cubic-bezier(.3,1.35,.5,1), background-color .22s ease-out; }
.bp-switch[aria-checked="true"] { background: var(--cream); }
.bp-switch[aria-checked="true"]::after { background: var(--bg); transform: translateX(24px); }

.bp-bar { height: 10px; border-radius: var(--radius-pill); background: rgba(255,255,255,.12); overflow: hidden; }
.bp-bar > i { display: block; height: 100%; width: var(--p, 30%); background: var(--cream); border-radius: var(--radius-pill); }

.bp-label { font: 700 18px/1.2 var(--font-sans); letter-spacing: 1.6px; text-transform: uppercase; color: var(--text-secondary); }

/* Key caps: the hint glyphs while the keyboard is in use */
.bp-g--key { border-radius: 7px; background: #ffffff; color: #000000; font-size: 13px; letter-spacing: .2px; }

/* A card that takes the focus (game page tab content) */
.bp-group { transition: outline-color .15s, translate .15s; }
.bp-group.is-focus { outline: 3px solid var(--cream); outline-offset: 6px; background: rgba(255,255,255,.08); }
.bp-chev { margin-left: auto; color: var(--text-secondary); font: 600 22px/1 var(--font-sans); }

/* A glyph the controller prints as a symbol (Menu, View, the PlayStation shapes) */
.bp-g--icon { width: 34px; padding: 0; }
.bp-g--icon svg { width: 18px; height: 18px; }



/* NX2Apple Launcher — components as CSS classes (nx-…), built on tokens.css.
   Each rule names the SwiftUI view it copies. The launcher is dark only. */

.nx-root { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 13px; -webkit-font-smoothing: antialiased; }
.nx-root button { font-family: inherit; }
.nx-root :focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }

/* Primary: a cream capsule (hero Play, sheet Done, first build) */
.nx-btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; cursor: pointer;
  background: var(--cream); color: var(--on-cream); border-radius: var(--radius-pill);
  font: 700 13.5px/1.2 var(--font-sans); padding: 9px 22px; }
.nx-btn-primary--hero { font-size: 18px; padding: 14px 30px; min-width: var(--size-play-min); }
.nx-btn-primary--large { font-size: 16px; font-weight: 600; padding: 15px 24px; }
.nx-btn-primary:disabled { opacity: .45; cursor: default; }

/* Secondary: LauncherSecondaryButtonStyle */
.nx-btn-secondary { display: inline-flex; align-items: center; justify-content: center; gap: 7px; cursor: pointer; white-space: nowrap;
  background: var(--fill-1); color: var(--text); border: 1px solid var(--line-2); border-radius: var(--radius-control);
  font: 600 13px/1.2 var(--font-sans); padding: 9px 15px; }
.nx-btn-secondary:active { background: var(--fill-pressed); }
.nx-btn-secondary--building { color: var(--building); border-color: rgba(255, 199, 61, .75); }
.nx-btn-secondary:disabled { opacity: .55; color: var(--unbuilt); cursor: default; }

/* Round icon button: hero Launch options (48 pt) */
.nx-btn-round { width: var(--size-round); height: var(--size-round); display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  border-radius: 50%; background: var(--fill-3); border: 1px solid var(--line-3); color: var(--text-strong); }

/* Manage button label: ellipsis.circle (27 pt, ultra light) and the word, no background */
.nx-manage { display: inline-flex; align-items: center; gap: 9px; background: none; border: 0; color: var(--text-strong); font: 400 13px/1 var(--font-sans); cursor: pointer; padding: 0; }
.nx-manage svg { width: 27px; height: 27px; }

/* Chip: cream outline capsule (Recompiler, Signer à nouveau) */
.nx-chip { display: inline-flex; align-items: center; gap: 6px; background: none; cursor: pointer;
  border: 1px solid var(--cream-line); border-radius: var(--radius-pill); color: var(--cream);
  font: 600 12px/1.2 var(--font-sans); padding: 4px 10px; }

/* Top-bar tab: a bold label on a soft pill when chosen */
.nx-tab { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; cursor: pointer;
  border-radius: var(--radius-control); padding: 10px 18px; color: var(--text); font: 500 15px/1.2 var(--font-sans); }
.nx-tab[aria-selected="true"] { background: var(--fill-3); font-weight: 700; color: var(--text-strong); }

/* Segmented: LauncherSegmented, the choice is a cream pill */
.nx-segmented { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--radius-pill); background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .08); }
.nx-segmented > button { flex: 1 1 0; border: 0; cursor: pointer; white-space: nowrap; background: none; border-radius: var(--radius-pill);
  padding: 6px 12px; color: rgba(255, 255, 255, .75); font: 500 12.5px/1.2 var(--font-sans); }
.nx-segmented > button[aria-selected="true"], .nx-segmented > button[aria-pressed="true"] { background: var(--cream); color: var(--on-cream); font-weight: 700; }

/* Status: a dot and the state, in the state's colour */
.nx-status { display: inline-flex; align-items: center; gap: 7px; font: 500 13px/1.3 var(--font-sans); color: var(--status, var(--unbuilt)); }
.nx-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.nx-status--ready { --status: var(--ready); }
.nx-status--building { --status: var(--building); }
.nx-status--unbuilt { --status: var(--unbuilt); }
.nx-status--prominent { font-size: 12px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; }
.nx-status--prominent::before { width: 9px; height: 9px; }
.nx-status__note { color: var(--text-secondary); font-weight: 400; letter-spacing: 0; text-transform: none; }

/* Artwork placeholder: a labelled gradient, never real game art */
.nx-art { position: relative; overflow: hidden; background: var(--art, var(--surface)); background-size: cover; background-position: center; }
.nx-art[data-label]::after { content: attr(data-label); position: absolute; left: 8px; bottom: 6px; font: 600 10px/1 var(--font-sans); letter-spacing: .4px; color: rgba(255, 255, 255, .7); }

/* Game card: the collection row */
.nx-card { display: flex; flex-direction: column; gap: 8px; width: var(--card-w, 260px); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; color: var(--text); }
.nx-card__art { width: 100%; aspect-ratio: 1.8; border-radius: var(--radius-thumb); box-shadow: inset 0 0 0 2px transparent; }
.nx-card__name { font: 600 16px/1.25 var(--font-sans); color: var(--text-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nx-card__bar { height: 3px; margin-top: 4px; border-radius: var(--radius-pill); background: transparent; }
.nx-card[aria-pressed="true"] .nx-card__art, .nx-card.is-selected .nx-card__art { box-shadow: inset 0 0 0 2px var(--cream); }
.nx-card[aria-pressed="true"] .nx-card__bar, .nx-card.is-selected .nx-card__bar { background: var(--cream); }

/* Manage menu: ManageMenuPanel, 250 pt, 36 pt rows */
.nx-menu { width: var(--size-menu-width); box-sizing: border-box; padding: 6px; display: flex; flex-direction: column;
  background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius-panel); box-shadow: var(--shadow-menu); }
.nx-menu__row { display: flex; align-items: center; gap: 11px; height: var(--size-menu-row); padding: 0 10px; border: 0; border-radius: var(--radius-row);
  background: none; color: var(--text); font: 500 13px/1 var(--font-sans); text-align: left; cursor: pointer; }
.nx-menu__row svg { width: 18px; height: 14px; flex: none; }
.nx-menu__row:hover, .nx-menu__row.is-highlighted { background: var(--fill-hover); }
.nx-menu__row:disabled { opacity: .4; cursor: default; background: none; }
.nx-menu__row--danger { color: var(--danger); }
.nx-menu__sep { height: 1px; margin: 4px 6px; background: rgba(255, 255, 255, .1); }

/* Sheet: LaunchOptionsView's layout */
.nx-sheet { display: flex; flex-direction: column; box-sizing: border-box; background: var(--bg); color: var(--text); border-radius: var(--radius-group);
  border: 1px solid var(--line-2); box-shadow: var(--shadow-sheet); overflow: hidden; }
.nx-sheet__header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 28px 30px 20px; }
.nx-sheet__title { margin: 0; font: 800 26px/1.15 var(--font-sans); letter-spacing: -.6px; color: var(--text-strong); }
.nx-sheet__subtitle { margin: 2px 0 0; font: 400 14px/1.35 var(--font-sans); color: var(--text-secondary); }
.nx-sheet__body { flex: 1 1 auto; min-height: 0; overflow: auto; padding: 0 30px 24px; display: flex; flex-direction: column; gap: 10px; }
.nx-sheet__footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 30px; border-top: 1px solid var(--line-1); }
.nx-sheet__note { font: 400 12px/1.4 var(--font-sans); color: var(--text-secondary); }
.nx-heading { margin: 8px 0 0 2px; font: 600 15px/1.25 var(--font-sans); color: var(--text-secondary); }
.nx-group { background: var(--surface-group); border: 1px solid var(--line-1); border-radius: var(--radius-group); }
.nx-group__row { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: var(--size-option-row); box-sizing: border-box; padding: 13px 18px; }
.nx-group__row + .nx-group__row { border-top: 1px solid rgba(255, 255, 255, .06); margin-left: 18px; padding-left: 0; }
.nx-group__label { font: 500 14px/1.3 var(--font-sans); color: var(--text); }
.nx-group__note { font: 400 12px/1.4 var(--font-sans); color: var(--text-secondary); }

/* Switch: LauncherSwitchStyle */
.nx-switch { width: 40px; height: 24px; border: 0; padding: 3px; border-radius: var(--radius-pill); background: var(--fill-track); cursor: pointer; display: inline-flex; justify-content: flex-start; }
.nx-switch::after { content: ""; width: 18px; height: 18px; border-radius: 50%; background: rgba(255, 255, 255, .85); box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.nx-switch[aria-checked="true"] { background: var(--cream); justify-content: flex-end; }
.nx-switch[aria-checked="true"]::after { background: var(--bg); }

/* Console tile: ConsoleGameTile, 1.8:1, 16 pt corners */
.nx-console-tile { position: relative; width: var(--tile-w, 470px); aspect-ratio: 1.8; border-radius: var(--radius-console); overflow: hidden;
  box-shadow: inset 0 0 0 1px var(--line-console); background: var(--art, var(--surface)); background-size: cover; background-position: center; }
.nx-console-tile.is-selected { transform: scale(1.025); outline: 2px solid var(--cream); outline-offset: 4px; }
.nx-console-tile__badge { position: absolute; left: 14px; bottom: 14px; padding: 10px 14px; border-radius: var(--radius-pill); background: var(--badge-bg);
  font: 600 18px/1 var(--font-sans); color: var(--text); }


body{margin:0}
.proto{position:relative;width:1920px;height:1080px;background:#0b0b0c;font-family:Manrope,system-ui,sans-serif;outline:none}
.proto:focus-visible{box-shadow:inset 0 0 0 3px #fff0d6}
.bp-tile,.bp-row,.bp-btn,.bp-play,.bp-filter,.brow,.key,.cat,.bp-group{transition:transform .18s cubic-bezier(.2,.8,.2,1),translate .14s ease-out,outline-color .15s,background-color .15s,box-shadow .18s}
.bp-row,.brow,.key,.cat{--nudge:3px}
.bump-left{translate:calc(-1 * var(--nudge,6px)) 0}.bump-right{translate:var(--nudge,6px) 0}.bump-up{translate:0 calc(-1 * var(--nudge,6px))}.bump-down{translate:0 var(--nudge,6px)}
.hide-focus .scr .bp-focus,.hide-focus .scr .is-focus{outline-color:transparent !important}
.bp-g--icon{width:34px;padding:0}
.bp-g--icon svg{width:18px;height:18px}
.bp-icon{transition:background-color .15s,color .15s,translate .14s ease-out}
/* Moving between screens: the new one fades in and slides a little, from the right going in, from the left coming back */
.scr{position:absolute;inset:0;transition:opacity .26s ease-out,transform .32s cubic-bezier(.2,.8,.2,1)}
.scr.is-entering{opacity:0;transform:translateX(28px);transition:none}
.scr.is-entering.from-left{transform:translateX(-28px)}
/* Menus slide in from their edge over a fading dim; dialogs settle in */
.bp-panel{transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s ease-out}
.bp-panel.p-in{transform:translateX(var(--px,60px));opacity:0;transition:none}
.bp-dim{transition:opacity .22s ease-out}
.bp-dim.p-in{opacity:0;transition:none}
.dlg{transition:opacity .2s ease-out,transform .26s cubic-bezier(.2,.8,.2,1)}
.dlg.p-in{opacity:0;transform:translate(-50%,-47%) scale(.97);transition:none}
.kb-row{display:flex;justify-content:center;gap:12px}
.key{width:104px;height:80px;border-radius:14px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);display:inline-flex;align-items:center;justify-content:center;font:600 30px/1 Manrope,sans-serif;color:#fff;box-sizing:border-box;transition:outline-color .12s}
.key--wide{width:220px;font-size:22px}
.key--space{width:560px;font-size:22px;color:rgba(235,235,245,.6)}
.key--go{width:220px;font-size:22px;background:#fff0d6;color:#000;border-color:#fff0d6;font-weight:800}
.key.is-focus{background:rgba(255,255,255,.18);outline:3px solid #fff0d6;outline-offset:2px}
.key--go.is-focus{background:#fff0d6}
.brow{display:flex;align-items:center;gap:28px;padding:18px 22px;border-radius:16px;box-sizing:border-box}
.brow.is-focus{background:rgba(255,255,255,.08);outline:3px solid #fff0d6;outline-offset:0}
.thumb{width:192px;aspect-ratio:1.8;border-radius:10px;background:var(--art);flex:none}
.bname{font:700 24px/1.2 Manrope,sans-serif;color:#fff}
.bsub{font:500 19px/1.3 Manrope,sans-serif;color:rgba(235,235,245,.6)}
.radio{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.35);box-sizing:border-box;flex:none;margin-left:auto}
.radio.on{border:8px solid #fff0d6}
.opt{display:flex;flex-direction:column;gap:4px}
.opt small{font:500 18px/1.3 Manrope,sans-serif;color:rgba(235,235,245,.6)}
.legend{display:inline-flex;align-items:center;gap:12px;padding:10px 18px 10px 10px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);font:500 20px/1 Manrope,sans-serif;color:rgba(235,235,245,.7)}
.legend b{color:#fff0d6;font-weight:800}
.lg-btn{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:rgba(255,255,255,.16);color:#fff;font:800 18px/1 Manrope,sans-serif}
.lg-btn.lg-a{background:#fff0d6;color:#000}
.lg-btn svg{width:20px;height:20px}
.toast{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);z-index:6;padding:16px 26px;border-radius:999px;background:rgba(26,26,28,.96);border:1px solid rgba(255,255,255,.14);box-shadow:0 12px 30px rgba(0,0,0,.5);font:600 20px/1.2 Manrope,sans-serif;color:#fff;white-space:nowrap}
.deck{position:absolute;left:0;right:0;top:1080px;height:340px;box-sizing:border-box;padding:0 72px;display:flex;align-items:center;gap:56px;background:#141416;border-top:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.92)}
.k{width:62px;height:62px;border-radius:50%;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.07);color:#fff;font:800 17px/1 Manrope,sans-serif;cursor:pointer}
.k:hover{background:rgba(255,255,255,.15)}
.k:active{background:#fff0d6;color:#000}
.k:focus-visible{outline:3px solid #fff0d6;outline-offset:3px}
.k--pill{width:auto;min-width:76px;height:46px;border-radius:999px;padding:0 16px;font-size:15px}
.k--sq{border-radius:12px}
.k--a{background:#fff0d6;color:#000;border-color:#fff0d6}
.fam{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.fam button{border:0;background:none;color:rgba(255,255,255,.75);font:600 15px/1 Manrope,sans-serif;padding:10px 16px;border-radius:999px;cursor:pointer}
.fam button[aria-pressed="true"]{background:#fff0d6;color:#000;font-weight:800}
.val{display:inline-flex;align-items:center;gap:18px;min-width:300px;justify-content:space-between;font:700 23px/1 Manrope,sans-serif;color:#fff0d6}
.val i{font-style:normal;color:rgba(255,240,214,.55);font-size:20px}
.note{font:500 18px/1.35 Manrope,sans-serif;color:rgba(235,235,245,.6)}
.dot{width:10px;height:10px;border-radius:50%;background:#fff0d6;flex:none}
.cat{display:flex;align-items:center;gap:16px;height:64px;padding:0 22px;border-radius:14px;font:600 23px/1 Manrope,sans-serif;color:rgba(255,255,255,.75);position:relative}
.cat small{margin-left:auto;font:500 18px/1 Manrope,sans-serif;color:rgba(235,235,245,.6)}
.cat.on{background:rgba(255,255,255,.1);color:#fff;font-weight:800}
.cat.on::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:4px;background:#fff0d6}
.cat.is-focus{outline:3px solid #fff0d6;outline-offset:0}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-sizing:border-box;padding:44px 48px;border-radius:24px;background:rgba(26,26,28,.98);border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 60px rgba(0,0,0,.55);z-index:4;display:flex;flex-direction:column;gap:18px}
.dlg h2{margin:0;font:800 40px/1.1 Manrope,sans-serif;letter-spacing:-.8px;color:#fff}
.dlg p{margin:0;font:500 21px/1.45 Manrope,sans-serif;color:rgba(235,235,245,.7)}
.danger{background:rgba(255,107,102,.14);border-color:rgba(255,107,102,.45);color:#ff6b66}
.callout{display:flex;gap:18px;align-items:flex-start;padding:22px 26px;border-radius:14px;background:rgba(255,199,61,.08);border:1px solid rgba(255,199,61,.35)}
.small{font:500 15px/1.45 Manrope,sans-serif;color:rgba(235,235,245,.6)}
.status{font:700 13px/1.2 Manrope,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:rgba(235,235,245,.6)}

html,body{margin:0;height:100%;background:#000;color:#fff;font-family:Manrope,system-ui,sans-serif;overflow:hidden}
.bar{position:fixed;left:0;right:0;top:0;height:56px;box-sizing:border-box;padding:0 16px 0 20px;display:flex;align-items:center;gap:12px;background:#121214;border-bottom:1px solid rgba(255,255,255,.08);font:500 13px/1 Manrope,sans-serif;color:rgba(235,235,245,.6);z-index:10;white-space:nowrap}
.brand{overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand b{color:#fff;font-weight:800;margin-right:6px}
.sp{flex:1}
.pad-pill{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);max-width:300px;overflow:hidden;text-overflow:ellipsis}
.pad-pill i{width:8px;height:8px;border-radius:50%;background:#ffc73d;flex:none}
.pad-pill.on{color:rgba(255,255,255,.88)}
.pad-pill.on i{background:#40d678}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
.seg button,.help>button,.icon{border:0;background:none;color:rgba(255,255,255,.75);font:600 13px/1 Manrope,sans-serif;padding:8px 13px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff0d6;color:#000;font-weight:800}
.help{position:relative}
.help>button,.icon{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);height:32px;padding:0 13px}
.icon{width:32px;padding:0;display:inline-flex;align-items:center;justify-content:center}
.seg button:hover,.help>button:hover,.icon:hover{color:#fff}
.pop{position:absolute;right:0;top:42px;width:280px;padding:16px 18px;border-radius:14px;background:#1a1a1c;border:1px solid rgba(255,255,255,.12);box-shadow:0 16px 40px rgba(0,0,0,.5);white-space:normal;font:500 13px/1.45 Manrope,sans-serif;color:rgba(235,235,245,.7)}
.pop b{display:block;color:#fff;font-weight:800;margin:0 0 8px}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0 0 14px}
.pop dt{color:#fff0d6;font-weight:700}
.pop dd{margin:0}
.pop p{margin:0}
@media (max-width:760px){.brand{display:none}}
.stage{position:fixed;left:0;top:56px;width:1920px;height:1080px;transform-origin:0 0}
.proto{outline:none}
</style>
</head>
<body>
<div class="bar">
  <span class="brand"><b>NX2Apple</b> Console mode · prototype</span>
  <span class="sp"></span>
  <span class="pad-pill" id="padpill" title=""><i></i><span id="padinfo">No controller · press a button</span></span>
  <span class="seg" role="group" aria-label="Button glyphs"><button data-fam="xbox">Xbox</button><button data-fam="ps">PlayStation</button><button data-fam="nintendo">Nintendo</button></span>
  <span class="help"><button id="helpbtn" aria-expanded="false">Keys</button>
    <div class="pop" id="help" hidden>
      <b>Keyboard</b>
      <dl><dt>← ↑ → ↓</dt><dd>Move</dd><dt>return</dt><dd>A</dd><dt>esc</dt><dd>B</dd><dt>X · Y</dt><dd>X · Y</dd><dt>Q · E</dt><dd>L · R</dd><dt>M</dt><dd>Main menu</dd><dt>V</dt><dd>Quick menu</dd><dt>H</dt><dd>Home</dd></dl>
      <b>Controller</b>
      <p>Use Chrome or Safari and press any button once. Firefox-based browsers may not receive the buttons on a Mac.</p>
    </div>
  </span>
  <button class="icon" id="reset" title="Restart" aria-label="Restart"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"></path></svg></button>
</div>
<div class="stage" id="stage"><div class="proto" id="proto" tabindex="0"></div></div>
<template id="tpl">
  <div class="bp {{tvCls}}">

    <div class="{{scrCls}}">
    <sc-if value="{{isBrowse}}" hint-placeholder-val="{{ true }}">
      <div class="bp-backdrop" style="--art: {{hero.art}}"></div>
    </sc-if>
    <sc-if value="{{isGameLike}}" hint-placeholder-val="{{ false }}">
      <div class="bp-backdrop" style="--art: {{game.art}}"></div>
    </sc-if>

    <sc-if value="{{showTop}}" hint-placeholder-val="{{ true }}">
      <header class="bp-top">
        <sc-if value="{{isTabs}}" hint-placeholder-val="{{ true }}">
          <span class="bp-word">{{screenTitle}}</span>
          <sc-if value="{{showSearchIcon}}" hint-placeholder-val="{{ true }}"><span class="{{searchCls}}" aria-label="Search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M16 16l4 4M11 17a6 6 0 1 1 0-12 6 6 0 0 1 0 12z"></path></svg></span></sc-if>
        </sc-if>
        <sc-if value="{{isGamePage}}" hint-placeholder-val="{{ false }}">
          <span class="bp-hint" style="color: rgba(235,235,245,.6)"><span class="{{bk.cls}}" aria-label="{{bk.name}}">{{bk.g}}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display: {{bk.svg}}"><path d="{{bk.d}}"></path></svg></span>{{backLabel}}</span>
        </sc-if>
        <span class="bp-spacer"></span>
        <span class="bp-pad"><span class="bp-pad__p">P1</span><span class="bp-pad__batt">78%</span></span>
        <span class="bp-pad bp-pad--low"><span class="bp-pad__p">P2</span><span class="bp-pad__batt">12%</span></span>
        <span class="bp-clock">21:42</span>
      </header>
    </sc-if>

    <sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
      <section style="position: absolute; left: 96px; top: 156px; width: 1100px; display: flex; flex-direction: column; gap: 22px; z-index: 1">
        <span class="{{hero.eyebrowCls}}">{{hero.statusText}}</span>
        <h1 class="bp-title">{{hero.n}}</h1>
        <div class="bp-meta"><span>{{hero.sub}}</span></div>
      </section>
      <div style="position: absolute; left: 0; right: 0; top: 420px; bottom: 84px; overflow: hidden; padding: 0 0 0 96px; z-index: 1">
        <div style="display: flex; flex-direction: column; gap: 40px; padding-top: 20px; transform: translateY(-{{homeScroll}}px); transition: transform .25s ease-out">
          <sc-for list="{{homeRows}}" as="row" hint-placeholder-count="3">
            <section style="display: flex; flex-direction: column; gap: 26px; opacity: {{row.opacity}}; transition: opacity .2s">
              <h2 class="bp-shelf-title">{{row.title}} <small>{{row.count}}</small></h2>
              <div style="display: flex; gap: 32px; align-items: flex-start">
                <sc-for list="{{row.tiles}}" as="t" hint-placeholder-count="5">
                  <div style="display: flex; flex-direction: column">
                    <div class="{{t.cls}}" style="--w: 420px; --art: {{t.art}}; --glow: {{t.glow}}"></div>
                    <div class="bp-cap"><span class="bp-cap__name">{{t.n}}</span><span class="bp-cap__sub">{{t.sub}}</span></div>
                  </div>
                </sc-for>
              </div>
            </section>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isLibrary}}" hint-placeholder-val="{{ false }}">
      <section style="position: absolute; left: 96px; right: 96px; top: 132px; display: flex; align-items: center; gap: 14px; z-index: 1">
        <nav class="bp-nav" aria-label="Filters">
          <span class="bp-g bp-g--sm">{{g.l}}</span>
          <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
            <span class="bp-tab" aria-selected="{{f.active}}">{{f.name}} <small style="opacity: .6">{{f.count}}</small></span>
          </sc-for>
          <span class="bp-g bp-g--sm">{{g.r}}</span>
        </nav>
      </section>
      <h2 class="bp-shelf-title" style="position: absolute; left: 96px; top: 222px; font-size: 26px; z-index: 1">{{libHeading}} <small>{{libCount}}</small></h2>
      <div style="position: absolute; left: 0; right: 0; top: 262px; bottom: 84px; overflow: hidden; padding: 24px 96px 0">
        <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); column-gap: 32px; row-gap: 40px; padding: 8px; transform: translateY(-{{libScroll}}px); transition: transform .25s ease-out">
          <sc-for list="{{libTiles}}" as="t" hint-placeholder-count="10">
            <div style="visibility: {{t.vis}}">
              <div class="{{t.cls}}" style="--w: 100%; --art: {{t.art}}; --glow: {{t.glow}}"></div>
              <div class="bp-cap" style="display: {{capDisplay}}"><span class="bp-cap__name">{{t.n}}</span><span class="{{t.statusCls}}" style="font-size: 18px">{{t.statusText}}</span></div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{isGamePage}}" hint-placeholder-val="{{ false }}">
      <section style="position: absolute; left: 96px; top: 210px; width: 1500px; display: flex; flex-direction: column; gap: 20px; z-index: 1">
        <span class="{{game.eyebrowCls}}">{{game.statusText}}</span>
        <h1 class="bp-title">{{game.n}}</h1>
      </section>
      <section style="position: absolute; left: 96px; right: 96px; top: 440px; display: flex; align-items: center; gap: 44px; z-index: 1">
        <span class="{{play.cls}}" style="min-width: 220px; justify-content: center">{{play.label}}</span>
        <div style="display: flex; flex-direction: column; gap: 8px"><span class="bp-label">Last played</span><span style="font: 700 24px/1.1 Manrope, sans-serif; color: #fff">{{game.sub}}</span></div>
        <div style="display: flex; flex-direction: column; gap: 8px"><span class="bp-label">Play time</span><span style="font: 700 24px/1.1 Manrope, sans-serif; color: #fff">14 h 20 min</span></div>
        <div style="display: flex; flex-direction: column; gap: 8px"><span class="bp-label">Saves</span><span style="font: 700 24px/1.1 Manrope, sans-serif; color: #40d678">In sync</span></div>
        <span class="bp-spacer"></span>
        <sc-for list="{{iconActs}}" as="a" hint-placeholder-count="3">
          <span class="{{a.cls}}" aria-label="{{a.label}}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{a.sw}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{a.d}}"></path></svg></span>
        </sc-for>
      </section>
      <nav class="bp-nav" aria-label="Game page tabs" style="position: absolute; left: 0; right: 0; top: 580px; justify-content: center; z-index: 1">
        <span class="bp-g bp-g--sm">{{g.l}}</span>
        <sc-for list="{{gameTabs}}" as="t" hint-placeholder-count="4">
          <span class="bp-tab" aria-selected="{{t.sel}}">{{t.name}}</span>
        </sc-for>
        <span class="bp-g bp-g--sm">{{g.r}}</span>
      </nav>
      <sc-if value="{{isCheatsTab}}" hint-placeholder-val="{{ false }}">
        <section style="position: absolute; left: 96px; right: 96px; top: 660px; display: grid; grid-template-columns: 1.4fr 1fr; gap: 28px; z-index: 1">
          <div class="bp-group" style="padding: 10px; display: flex; flex-direction: column; gap: 2px">
            <sc-for list="{{cheatRows}}" as="ch" hint-placeholder-count="5">
              <div class="{{ch.cls}}" style="height: 60px; opacity: {{ch.op}}">{{ch.n}}<span class="bp-spacer"></span><span class="bp-row__end" style="color: {{ch.endColor}}; margin-right: 16px">{{ch.end}}</span><sc-if value="{{ch.isSwitch}}" hint-placeholder-val="{{ true }}"><span class="bp-switch" aria-checked="{{ch.on}}"></span></sc-if></div>
            </sc-for>
          </div>
          <div class="bp-group" style="padding: 24px 28px; display: flex; flex-direction: column; gap: 10px; align-self: start">
            <span class="bp-label">This build</span>
            <span style="font: 600 22px/1.2 Manrope, sans-serif; color: #fff">4F8A1C93E2B7D051</span>
            <span class="note">Switches are saved at once and apply the next time the game starts. Cheats are imported on the desktop.</span>
          </div>
        </section>
      </sc-if>
      <sc-if value="{{notCheatsTab}}" hint-placeholder-val="{{ true }}">
      <section style="position: absolute; left: 96px; right: 96px; top: 680px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; z-index: 1">
        <sc-for list="{{tabCards}}" as="c" hint-placeholder-count="3">
          <div class="{{c.cls}}" style="padding: 22px 26px; display: flex; flex-direction: column; gap: 10px">
            <span class="bp-label">{{c.label}}</span>
            <span style="font: 600 24px/1.3 Manrope, sans-serif; color: #fff">{{c.value}}</span>
            <span style="font: 500 19px/1.3 Manrope, sans-serif; color: rgba(235,235,245,.6)">{{c.note}}</span>
          </div>
        </sc-for>
      </section>
      </sc-if>
    </sc-if>

    <sc-if value="{{isLaunch}}" hint-placeholder-val="{{ false }}">
      <nav style="position: absolute; left: 72px; top: 136px; width: 420px; display: flex; flex-direction: column; gap: 6px; z-index: 1" aria-label="Sections">
        <sc-for list="{{loCats}}" as="lc" hint-placeholder-count="3"><span class="{{lc.cls}}">{{lc.name}}<small>{{lc.count}}</small></span></sc-for>
        <div style="height: 1px; background: rgba(255,255,255,.1); margin: 18px 22px"></div>
        <span class="note" style="padding: 0 22px">{{loChanged}}</span>
        <span class="{{loResetCls}}" style="margin: 22px 0 0 22px; align-self: flex-start">Reset to tested defaults</span>
      </nav>
      <section class="bp-group" style="position: absolute; left: 540px; right: 96px; top: 136px; padding: 12px; display: flex; flex-direction: column; gap: 4px; z-index: 1; background: rgba(20,20,22,.92)" aria-label="Basic settings">
        <sc-for list="{{loRows}}" as="lr" hint-placeholder-count="7">
          <div class="{{lr.cls}}" style="height: auto; min-height: 76px; padding: 14px 22px; flex-wrap: wrap; row-gap: 8px; opacity: {{lr.op}}"><span class="dot" style="opacity: {{lr.dot}}"></span>{{lr.n}}<span class="bp-spacer"></span><span class="val"><i>◀</i>{{lr.v}}<i>▶</i></span><sc-if value="{{lr.hasNote}}" hint-placeholder-val="{{ false }}"><span class="note" style="flex-basis: 100%; padding-left: 30px">{{lr.note}}</span></sc-if></div>
        </sc-for>
      </section>
    </sc-if>

    <sc-if value="{{isSettings}}" hint-placeholder-val="{{ false }}">
      <nav style="position: absolute; left: 72px; top: 136px; width: 420px; display: flex; flex-direction: column; gap: 6px" aria-label="Settings sections">
        <span class="cat on">General</span>
        <span class="cat">Controllers<small>2 connected</small></span>
        <span class="cat">Home button<small style="color: #ffc73d">Needs a step</small></span>
