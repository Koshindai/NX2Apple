<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Console mode In-game overlay</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nx2apple-launcher/components/bundle.css">
<link rel="stylesheet" href="bp.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="bp" style="font-family: Manrope, system-ui, sans-serif">
  <div style="position: absolute; inset: 0; background: linear-gradient(140deg,#4a1f2c,#a8452f 60%,#f2a65a); filter: blur(6px) brightness(.55); transform: scale(1.02)"></div>
  <span style="position: absolute; right: 72px; top: 40px; font: 600 14px/1 Manrope, sans-serif; color: rgba(255,255,255,.55)">[The running game, paused behind the overlay]</span>

  <aside class="bp-panel" style="left: 0; width: 600px; padding: 56px 32px 110px; gap: 6px; background: rgba(14,14,15,.94); border-right: 1px solid var(--line-2)" aria-label="Game menu">
    <div style="display: flex; gap: 20px; align-items: center; padding: 0 16px 30px">
      <div class="bp-tile" style="--w: 160px; --art: linear-gradient(140deg,#4a1f2c,#a8452f 60%,#f2a65a); border-radius: 10px"></div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font: 800 30px/1.1 Manrope, sans-serif; letter-spacing: -.6px; color: #fff">[Game B]</span>
        <span style="font: 500 18px/1 Manrope, sans-serif; color: var(--text-secondary)">Playing for 42 min</span>
      </div>
    </div>
    <button class="bp-row is-focus"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"></path></svg>Resume</button>
    <button class="bp-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12a4 4 0 0 1 4 4v2a3 3 0 0 1-5.4 1.8L15 14H9l-1.6 1.8A3 3 0 0 1 2 14v-2a4 4 0 0 1 4-4z"></path><path d="M7 10.5v3M5.5 12h3"></path></svg>Controllers<span class="bp-row__end">2 connected</span></button>
    <button class="bp-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-6 4 3 5-7 4 4"></path></svg>Frame rate overlay<span class="bp-spacer"></span><span class="bp-switch" role="switch" aria-checked="true" aria-label="Frame rate overlay"></span></button>
    <button class="bp-row"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>Launch options<span class="bp-row__end">Next start</span></button>
    <div class="bp-sep"></div>
    <button class="bp-row bp-row--danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>Quit game</button>
    <span style="margin: 8px 22px 0; font: 400 18px/1.4 Manrope, sans-serif; color: var(--text-secondary)">Save in the game first. Quitting closes it at once.</span>
  </aside>

  <div class="bp-group" style="position: absolute; right: 72px; top: 96px; width: 380px; padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; background: rgba(14,14,15,.86)">
    <div style="display: flex; align-items: baseline; justify-content: space-between">
      <span class="bp-label">Performance</span>
      <span style="font: 800 30px/1 Manrope, sans-serif; color: #fff; font-variant-numeric: tabular-nums">60 <span style="font-size: 18px; font-weight: 600; color: var(--text-secondary)">fps</span></span>
    </div>
    <div style="height: 64px; display: flex; align-items: flex-end; gap: 3px" aria-hidden="true">
      <i style="flex: 1; height: 40%; background: rgba(64,214,120,.75); border-radius: 2px"></i><i style="flex: 1; height: 42%; background: rgba(64,214,120,.75); border-radius: 2px"></i><i style="flex: 1; height: 38%; background: rgba(64,214,120,.75); border-radius: 2px"></i><i style="flex: 1; height: 41%; background: rgba(64,214,120,.75); border-radius: 2px"></i><i style="flex: 1; height: 90%; background: #ffc73d; border-radius: 2px"></i><i style="flex: 1; height: 40%; background: rgba(64,214,120,.75); border-radius: 2px"></i><i style="flex: 1; height: 39%; background: rgba(64,214,120,.75); border-radius: 2px"></i><i style="flex: 1; height: 42%; background: rgba(64,214,120,.75); border-radius: 2px"></i><i style="flex: 1; height: 40%; background: rgba(64,214,120,.75); border-radius: 2px"></i><i style="flex: 1; height: 41%; background: rgba(64,214,120,.75); border-radius: 2px"></i><i style="flex: 1; height: 38%; background: rgba(64,214,120,.75); border-radius: 2px"></i><i style="flex: 1; height: 40%; background: rgba(64,214,120,.75); border-radius: 2px"></i><i style="flex: 1; height: 43%; background: rgba(64,214,120,.75); border-radius: 2px"></i><i style="flex: 1; height: 40%; background: rgba(64,214,120,.75); border-radius: 2px"></i><i style="flex: 1; height: 39%; background: rgba(64,214,120,.75); border-radius: 2px"></i><i style="flex: 1; height: 41%; background: rgba(64,214,120,.75); border-radius: 2px"></i>
    </div>
    <span style="font: 500 18px/1.3 Manrope, sans-serif; color: var(--text-secondary)">16.7 ms average · 1 slow frame in the last minute</span>
  </div>

  <footer class="bp-hints" style="z-index: 4">
    <span class="bp-hint"><span class="bp-g"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"></path></svg></span>Resume</span>
    <span class="bp-spacer"></span>
    <span class="bp-hint"><span class="bp-g">B</span>Resume</span>
    <span class="bp-hint"><span class="bp-g bp-g--a">A</span>Select</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
