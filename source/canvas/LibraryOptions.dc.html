<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Console mode library options</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nx2apple-launcher/components/bundle.css">
<link rel="stylesheet" href="bp.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap">
<style>
body{margin:0}
.radio{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.35);box-sizing:border-box;flex:none;margin-left:auto}
.radio.on{border:8px solid #fff0d6}
</style>
</helmet>
<div class="bp" style="font-family: Manrope, system-ui, sans-serif">
  <header class="bp-top">
    <span class="bp-word">Library</span>
    <span class="bp-spacer"></span>
    <span class="bp-pad"><span class="bp-pad__p">P1</span><span class="bp-pad__batt">78%</span></span>
    <span class="bp-clock">21:42</span>
  </header>
  <section style="position: absolute; left: 96px; right: 96px; top: 132px; display: flex; flex-direction: column; gap: 28px">
    <nav class="bp-nav" aria-label="Filters"><span class="bp-g bp-g--sm">LB</span><span class="bp-tab" aria-selected="true">All <small style="opacity: .6">24</small></span><span class="bp-tab">Ready on Mac</span><span class="bp-tab">Not compiled</span><span class="bp-tab">Needs game data</span><span class="bp-g bp-g--sm">RB</span></nav>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 32px">
      <div class="bp-tile" style="--w: 100%; --art: linear-gradient(125deg,#1f3a4d 0%,#3d6b5a 45%,#e0b660 100%)"></div>
      <div class="bp-tile" style="--w: 100%; --art: linear-gradient(140deg,#4a1f2c,#a8452f 60%,#f2a65a)"></div>
      <div class="bp-tile" style="--w: 100%; --art: linear-gradient(160deg,#16243f,#2f5f8f 55%,#9fd0e0)"></div>
      <div class="bp-tile" style="--w: 100%; --art: linear-gradient(130deg,#2a2a1e,#6b7a3a 55%,#d8d08a)"></div>
      <div class="bp-tile" style="--w: 100%; --art: linear-gradient(150deg,#3a1d3f,#7a3e5c 50%,#e8a0a0)"></div>
      <div class="bp-tile" style="--w: 100%; --art: linear-gradient(120deg,#102a2a,#1f6b66 55%,#7fd6b8)"></div>
      <div class="bp-tile" style="--w: 100%; --art: linear-gradient(135deg,#3b2a5c 0%,#b4553c 55%,#f0b45a 100%)"></div>
      <div class="bp-tile" style="--w: 100%; --art: linear-gradient(140deg,#1d2b1f,#3f6a3a 55%,#b8d68a)"></div>
      <div class="bp-tile" style="--w: 100%; --art: linear-gradient(150deg,#14202e,#2e4a6b 55%,#c0d4e8)"></div>
      <div class="bp-tile" style="--w: 100%; --art: linear-gradient(130deg,#30182a,#6a2f4f 55%,#d88aa8)"></div>
    </div>
  </section>
  <div class="bp-dim"></div>

  <aside class="bp-panel" style="right: 0; width: 600px; padding: 44px 36px 110px; gap: 10px; border-left: 1px solid rgba(255,255,255,.1)" aria-label="Library options">
    <h2 style="margin: 0 0 14px 6px; font: 800 34px/1.1 Manrope, sans-serif; letter-spacing: -.6px; color: #fff">Library options</h2>
    <span class="bp-label" style="margin: 0 0 4px 6px">Sort by</span>
    <div class="bp-group" style="padding: 8px">
      <div class="bp-row is-focus" style="height: 72px">Recently played<span class="radio on"></span></div>
      <div class="bp-row" style="height: 72px">Name<span class="radio"></span></div>
      <div class="bp-row" style="height: 72px">Recently compiled<span class="radio"></span></div>
      <div class="bp-row" style="height: 72px">Size on disk<span class="radio"></span></div>
    </div>
    <span class="bp-label" style="margin: 18px 0 4px 6px">Show</span>
    <div class="bp-group" style="padding: 8px">
      <div class="bp-row" style="height: 72px">iPhone-only games<span class="bp-spacer"></span><span class="bp-switch" aria-checked="true"></span></div>
      <div class="bp-row" style="height: 72px">Game names under tiles<span class="bp-spacer"></span><span class="bp-switch" aria-checked="true"></span></div>
    </div>
  </aside>

  <footer class="bp-hints" style="z-index: 4">
    <span class="bp-spacer"></span>
    <span class="bp-hint"><span class="bp-g">B</span>Close</span>
    <span class="bp-hint"><span class="bp-g bp-g--a">A</span>Choose</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
