<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Console mode manage menu</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/nx2apple-launcher/components/bundle.css">
<link rel="stylesheet" href="bp.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap">
<style>
body{margin:0}
.radio{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.35);box-sizing:border-box;flex:none}
.radio.on{border:8px solid #fff0d6}
.val{display:inline-flex;align-items:center;gap:18px;min-width:300px;justify-content:space-between;font:700 23px/1 Manrope,sans-serif;color:#fff0d6}
.val i{font-style:normal;color:rgba(255,240,214,.55);font-size:20px}
.note{font:500 18px/1.35 Manrope,sans-serif;color:rgba(235,235,245,.6)}
.dot{width:10px;height:10px;border-radius:50%;background:#fff0d6;flex:none}
.cat{display:flex;align-items:center;gap:16px;height:64px;padding:0 22px;border-radius:14px;font:600 23px/1 Manrope,sans-serif;color:rgba(255,255,255,.75);position:relative}
.cat small{margin-left:auto;font:500 18px/1 Manrope,sans-serif;color:rgba(235,235,245,.6)}
.cat.on{background:rgba(255,255,255,.1);color:#fff;font-weight:800}
.cat.on::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:4px;border-radius:4px;background:#fff0d6}
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-sizing:border-box;padding:44px 48px;border-radius:24px;background:rgba(26,26,28,.98);border:1px solid rgba(255,255,255,.12);box-shadow:0 24px 60px rgba(0,0,0,.55);z-index:3;display:flex;flex-direction:column;gap:18px}
.dlg h2{margin:0;font:800 40px/1.1 Manrope,sans-serif;letter-spacing:-.8px;color:#fff}
.dlg p{margin:0;font:500 21px/1.45 Manrope,sans-serif;color:rgba(235,235,245,.7)}
.danger{background:rgba(255,107,102,.14);border-color:rgba(255,107,102,.45);color:#ff6b66}
.callout{display:flex;gap:18px;align-items:flex-start;padding:22px 26px;border-radius:14px;background:rgba(255,199,61,.08);border:1px solid rgba(255,199,61,.35)}
</style>
</helmet>
<div class="bp" style="font-family: Manrope, system-ui, sans-serif">
  <div class="bp-backdrop" style="--art: linear-gradient(140deg,#4a1f2c,#a8452f 60%,#f2a65a)"></div>
  <header class="bp-top">
    <span class="bp-hint" style="color: var(--text-secondary)"><span class="bp-g">B</span>Library</span>
    <span class="bp-spacer"></span>
    <span class="bp-pad"><span class="bp-pad__p">P1</span><span class="bp-pad__batt">78%</span></span>
    <span class="bp-clock">21:42</span>
  </header>
  <section style="position: absolute; left: 96px; top: 210px; display: flex; flex-direction: column; gap: 20px; z-index: 1">
    <span class="bp-eyebrow">Ready on Mac and iPhone</span>
    <h1 class="bp-title">[Game B]</h1>
  </section>
  <section style="position: absolute; left: 96px; right: 96px; top: 440px; display: flex; align-items: center; gap: 44px; z-index: 1">
    <span class="bp-play" style="min-width: 220px; justify-content: center">Play</span>
    <span class="bp-spacer"></span>
    <span class="bp-btn bp-btn--round"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12a4 4 0 0 1 4 4v2a3 3 0 0 1-5.4 1.8L15 14H9l-1.6 1.8A3 3 0 0 1 2 14v-2a4 4 0 0 1 4-4zM7 10.5v3M5.5 12h3"></path></svg></span>
    <span class="bp-btn bp-btn--round"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8M16 5v4M10 15v4"></path></svg></span>
    <span class="bp-btn bp-btn--round bp-focus" aria-label="Manage"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></span>
  </section>
  <div class="bp-dim" style="z-index: 2; background: rgba(8,8,9,.5)"></div>

  <aside class="bp-panel" style="right: 0; width: 600px; padding: 44px 36px 110px; gap: 4px; border-left: 1px solid rgba(255,255,255,.1)" role="menu" aria-label="Manage [Game B]">
    <h2 style="margin: 0 0 18px 6px; font: 800 34px/1.1 Manrope, sans-serif; letter-spacing: -.6px; color: #fff">Manage [Game B]</h2>
    <div class="bp-row is-focus">Compile again<span class="bp-row__end">Mac and iPhone</span></div>
    <div class="bp-row">Saves</div>
    <div class="bp-row">Cheats<span class="bp-row__end">3 on</span></div>
    <div class="bp-row">Change artwork</div>
    <div class="bp-sep"></div>
    <div class="bp-row">Show in Finder<span class="bp-row__end">On the desktop</span></div>
    <div class="bp-row">Show log<span class="bp-row__end">On the desktop</span></div>
    <div class="bp-sep"></div>
    <div class="bp-row">Remove from collection</div>
    <div class="bp-row bp-row--danger">Delete game…</div>
  </aside>

  <footer class="bp-hints" style="z-index: 4">
    <span class="bp-spacer"></span>
    <span class="bp-hint"><span class="bp-g">B</span>Close</span>
    <span class="bp-hint"><span class="bp-g bp-g--a">A</span>Choose</span>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
